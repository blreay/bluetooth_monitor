plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blreay.bandreset.gpt'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blreay.bandreset.gpt'
        minSdk 26
        // Intentional: this private sideloaded utility uses legacy Bluetooth toggle APIs.
        targetSdk 32
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Sideload only: target 32 is required for the public Bluetooth toggle compatibility path.
        // ProtectedPermissions: BLUETOOTH_PRIVILEGED and WRITE_SECURE_SETTINGS are declared
        // intentionally — the user requested maximum possible permissions for personal use.
        disable 'ExpiredTargetSdkVersion', 'ProtectedPermissions'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Shizuku 13.x — privileged Bluetooth toggle to bypass OEM confirmation dialogs.
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
}